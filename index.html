<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hub</title>
  <meta name="description" content="Saathvik's personal command center: mail, calendar, tasks, notes, GitHub and portfolio in one place.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hub">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="layout">
    <aside class="sidebar">
      <a class="brand" href="#/today"><img src="icons/icon.svg" alt="" width="28" height="28"><span>HUB</span></a>
      <nav id="sidebar-nav" class="side-nav" aria-label="Main"></nav>
      <div class="sidebar-foot" id="account"></div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <a class="brand topbar-brand" href="#/today"><img src="icons/icon.svg" alt="" width="24" height="24"><span>HUB</span></a>
        <div class="topbar-actions">
          <button class="btn btn-small palette-btn" id="palette-btn" type="button" aria-keyshortcuts="Control+K"><span>Search &amp; commands</span><kbd>Ctrl K</kbd></button>
          <button class="btn btn-small" id="refresh" type="button" aria-keyshortcuts="R">Refresh</button>
        </div>
      </header>
      <div id="banner" class="banner" role="status" hidden></div>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
  <dialog id="modal" class="modal" aria-label="Dialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="empty">Hub needs JavaScript turned on.</p></noscript>
</body>
</html>
